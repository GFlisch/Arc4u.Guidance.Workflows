name: Build .NET Blazor App

on: 
  workflow_call:
    inputs:
      blazorAppName:
        description: 'Name of the blazor app'     
        required: true
        type: string
      solutionName:
        description: 'Name of the solution'     
        required: true
        type: string
      dotNet:
        description: 'Version of the .Net runtime'     
        required: true
        type: string
      environment:
          description: 'Define the  Environment: Prod, Acc, Test, Dev'     
          required: true
          type: string      
      testFilter:
        description: 'Add a filter expression when running the unit test projects'
        required: true
        type: string
      nuget-source-url:
        description: 'URL of the private NuGet feed'
        required: false
        type: string
        default: ''
      nuget-source-name:
        description: 'Name for the NuGet source'
        required: false
        type: string
        default: 'PrivateFeed'
      nuget-username:
        description: 'Username for NuGet authentication'
        required: false
        type: string
        default: 'az'
    secrets:
      AUTH_NUGET_PASSWORD:
        description: 'PAT for authenticating to the private NuGet feed'
        required: false

env:
  blazorRoot: './src/FE/${{ inputs.blazorAppName }}/${{ inputs.solutionName }}.${{ inputs.blazorAppName }}/'
  host: './src/FE/${{ inputs.blazorAppName }}/${{ inputs.solutionName }}.${{ inputs.blazorAppName }}/${{ inputs.solutionName }}.${{ inputs.blazorAppName }}.csproj'
  buildConfiguration: 'Release'  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
           dotnet-version: ${{ inputs.dotNet }}

      - name: Register private NuGet source
        if: ${{ inputs.nuget-source-url != '' }}
        uses: GFlisch/Arc4u.Guidance.Workflows/.github/actions/register-nuget-source@v10
        with:
          source-url: ${{ inputs.nuget-source-url }}
          source-name: ${{ inputs.nuget-source-name }}
          username: ${{ inputs.nuget-username }}
          password: ${{ secrets.AUTH_NUGET_PASSWORD }}

      - name: Run Test projects matching *UnitTest.csproj
        if: inputs.testFilter == ''
        run: |
            Get-ChildItem -Filter *.${{ inputs.blazorAppName }}.*UnitTest.csproj -Recurse | ForEach-Object { dotnet test $_.FullName -c ${{ env.buildConfiguration }}  }
        shell: pwsh            

      - name: Run Test projects matching *UnitTest.csproj with filter ${{ inputs.testFilter }}
        if: inputs.testFilter != ''
        run: |
            Get-ChildItem -Filter *.${{ inputs.blazorAppName }}.*UnitTest.csproj -Recurse | ForEach-Object { dotnet test $_.FullName -c ${{ env.buildConfiguration }} --filter '${{ inputs.testFilter }}' }
        shell: pwsh            

      - name: Build
        run: dotnet publish  ${{ env.host }}  -c ${{ env.buildConfiguration }} -o ./Service

      - name: Download Brotoli decode.min.js
        run: |
          curl -L https://raw.githubusercontent.com/google/brotli/master/js/decode.min.js -o ./Service/wwwroot/decode.min.js

      # Add the nginx.conf file at the level of the Service folder.
      # The Docker.yml is building the Dockerfile with the folder content of the Service folder!
      # This is the job of the Dockerfile to remove the nginx.conf file from the Service folder and copy it to the /etc/nginx folder.
      - name: Copy nginx file
        run: cp ./src/FE/${{ inputs.blazorAppName }}/nginx.conf ./Service/nginx.conf  
      
      - name: Copy deploy file
        run: cp ./src/FE/${{ inputs.blazorAppName }}/deploy.yml ./deploy.yml  
      
      - name: Copy Docker file
        run: cp ./src/FE/${{ inputs.blazorAppName }}/Dockerfile ./Dockerfile          

      - name: Move settings files to a config folder.
        run:  | 
            mkdir -p ./Service/Configs
            mv ./Service/wwwroot/appsettings*.json* ./Service/Configs  

      - name: Save artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifact
          path: |
            ./Service
            ./Dockerfile
            ./nginx.conf
            ./deploy.yml
          retention-days: 1